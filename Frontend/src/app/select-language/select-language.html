<div class="select-area">
  <label for="language">Wybierz język docelowy:</label>
  <select id="language" [(ngModel)]="selectedLanguage">
    <option *ngFor="let code of languageCodes" [value]="code">
      {{ code }} - {{ languages[code] }}
    </option>
  </select>
</div>

<div>
    <button class="translate-btn random-btn" (click)="RadomLan()">Losuj język</button>
</div>
